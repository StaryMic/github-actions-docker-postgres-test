# This is a basic workflow to help you get started with Actions

name: Builds/Runs Docker container and tests the DB within it.

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-image:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env: # yes I know I can put these as secrets, but this is just for testing. Bite me.
        POSTGRES_DB: maindb
        POSTGRES_USER: postgres-user
        POSTGRES_PASSWORD: password

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:    
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      # Run Docker Compose to make image (runs in background)
      - name: Run Docker Compose
        run: docker compose up --build -d
        
        # Wait until the server is ready.
      - name: Wait for port to be open.
        run: |
            sleep 3000
            pg_isready -d maindb -h localhost -t 10 \

      # Runs a single command using the runners shell
      - name: Init Database with values
        run: ./init.sh

      # Check if the users have been added correctly to the database.
      - name: Check DB for Users
        run: psql -U postgres-user --dbname=maindb -c 'SELECT * FROM users'
